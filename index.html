<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login with Token Validation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#1e40af'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full space-y-8 p-8 bg-white rounded-xl shadow-lg">
        <!-- Login Form -->
        <div id="loginForm">
            <div class="text-center">
                <h2 class="mt-6 text-3xl font-bold text-gray-900">Sign in to your account</h2>
                <p class="mt-2 text-sm text-gray-600">Enter your credentials to continue</p>
            </div>
            <form class="mt-8 space-y-6" id="loginFormElement">
                <div class="rounded-md shadow-sm space-y-4">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
                        <input id="email" name="email" type="email" autocomplete="email" required 
                               class="appearance-none relative block w-full px-3 py-2 border border-gray-300 
                                      placeholder-gray-500 text-gray-900 rounded-md focus:outline-none 
                                      focus:ring-primary focus:border-primary focus:z-10 sm:text-sm"
                               placeholder="Enter your email">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input id="password" name="password" type="password" autocomplete="current-password" required 
                               class="appearance-none relative block w-full px-3 py-2 border border-gray-300 
                                      placeholder-gray-500 text-gray-900 rounded-md focus:outline-none 
                                      focus:ring-primary focus:border-primary focus:z-10 sm:text-sm"
                               placeholder="Enter your password">
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox" 
                               class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                        <label for="remember-me" class="ml-2 block text-sm text-gray-900">Remember me</label>
                    </div>
                    <div class="text-sm">
                        <a href="#" class="font-medium text-primary hover:text-secondary">Forgot password?</a>
                    </div>
                </div>

                <div>
                    <button type="submit" 
                            class="group relative w-full flex justify-center py-2 px-4 border border-transparent 
                                   text-sm font-medium rounded-md text-white bg-primary hover:bg-secondary 
                                   focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                        Sign in
                    </button>
                </div>
            </form>
            
            <div class="mt-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-gray-500">Or continue with</span>
                    </div>
                </div>
                <div class="mt-6 grid grid-cols-2 gap-3">
                    <button type="button" 
                            class="w-full inline-flex justify-center py-2 px-4 border border-gray-300 
                                   rounded-md shadow-sm bg-white text-sm font-medium text-gray-500 
                                   hover:bg-gray-50">
                        Google
                    </button>
                    <button type="button" 
                            class="w-full inline-flex justify-center py-2 px-4 border border-gray-300 
                                   rounded-md shadow-sm bg-white text-sm font-medium text-gray-500 
                                   hover:bg-gray-50">
                        GitHub
                    </button>
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="hidden text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mx-auto"></div>
            <p class="mt-4 text-gray-600">Validating token...</p>
        </div>

        <!-- Dashboard (Visible after successful login) -->
        <div id="dashboard" class="hidden">
            <div class="text-center">
                <h2 class="text-3xl font-bold text-gray-900">Welcome to Dashboard</h2>
                <p class="mt-2 text-sm text-gray-600">You have successfully logged in</p>
            </div>
            <div class="mt-8 space-y-4">
                <div class="bg-gray-50 p-4 rounded-lg">
                    <h3 class="font-medium text-gray-900">User Information</h3>
                    <p class="text-sm text-gray-600 mt-1" id="userEmail">Email: loading...</p>
                    <p class="text-sm text-gray-600" id="tokenStatus">Token Status: Valid</p>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="refreshToken()" 
                            class="py-2 px-4 border border-transparent rounded-md shadow-sm text-sm 
                                   font-medium text-white bg-green-600 hover:bg-green-700">
                        Refresh Token
                    </button>
                    <button onclick="logout()" 
                            class="py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm 
                                   font-medium text-gray-700 bg-white hover:bg-gray-50">
                        Logout
                    </button>
                </div>
            </div>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden p-4 bg-red-50 border border-red-200 rounded-md">
            <p class="text-red-800 text-sm" id="errorText"></p>
        </div>
    </div>

    <script>
        // Check for existing token on page load
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('authToken');
            if (token) {
                validateToken(token);
            }
        });

        // Handle login form submission
        document.getElementById('loginFormElement').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            showLoading();
            
            try {
                // Simulate API call to backend login endpoint
                const response = await mockLoginAPI(email, password);
                
                if (response.success) {
                    // Store token in localStorage
                    localStorage.setItem('authToken', response.token);
                    localStorage.setItem('userEmail', email);
                    
                    // Validate the token with middleware
                    await validateToken(response.token);
                } else {
                    showError(response.message || 'Login failed');
                }
            } catch (error) {
                showError('Network error. Please try again.');
            } finally {
                hideLoading();
            }
        });

        // Token validation middleware function
        async function validateToken(token) {
            showLoading();
            
            try {
                // Simulate token validation with backend middleware
                const isValid = await mockTokenValidationAPI(token);
                
                if (isValid) {
                    // Token is valid, show dashboard
                    showDashboard();
                } else {
                    // Token is invalid, clear storage and show login
                    clearAuthData();
                    showLogin();
                    showError('Session expired. Please login again.');
                }
            } catch (error) {
                showError('Token validation failed');
                clearAuthData();
                showLogin();
            } finally {
                hideLoading();
            }
        }

        // Refresh token function
        async function refreshToken() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                showError('No token found');
                return;
            }
            
            showLoading();
            
            try {
                // Simulate token refresh API call
                const newToken = await mockTokenRefreshAPI(token);
                
                if (newToken) {
                    localStorage.setItem('authToken', newToken);
                    showDashboard();
                    showError('Token refreshed successfully!', 'success');
                } else {
                    showError('Token refresh failed');
                }
            } catch (error) {
                showError('Failed to refresh token');
            } finally {
                hideLoading();
            }
        }

        // Logout function
        function logout() {
            clearAuthData();
            showLogin();
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        // Helper functions
        function showLoading() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('errorMessage').classList.add('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingState').classList.add('hidden');
        }

        function showDashboard() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('userEmail').textContent = `Email: ${localStorage.getItem('userEmail') || 'Unknown'}`;
        }

        function showLogin() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('loadingState').classList.add('hidden');
        }

        function showError(message, type = 'error') {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            
            errorText.textContent = message;
            errorDiv.classList.remove('hidden');
            
            if (type === 'success') {
                errorDiv.classList.remove('bg-red-50', 'border-red-200');
                errorDiv.classList.add('bg-green-50', 'border-green-200');
                errorText.classList.remove('text-red-800');
                errorText.classList.add('text-green-800');
            } else {
                errorDiv.classList.remove('bg-green-50', 'border-green-200');
                errorDiv.classList.add('bg-red-50', 'border-red-200');
                errorText.classList.remove('text-green-800');
                errorText.classList.add('text-red-800');
            }
            
            // Auto-hide success messages after 3 seconds
            if (type === 'success') {
                setTimeout(() => {
                    errorDiv.classList.add('hidden');
                }, 3000);
            }
        }

        function clearAuthData() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userEmail');
        }

        // Mock API functions (Replace with actual API calls)
        async function mockLoginAPI(email, password) {
            // Simulate API delay
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Mock validation
            if (email && password.length >= 6) {
                return {
                    success: true,
                    token: 'mock-jwt-token-' + Date.now(),
                    user: { email }
                };
            } else {
                return {
                    success: false,
                    message: 'Invalid credentials'
                };
            }
        }

        async function mockTokenValidationAPI(token) {
            // Simulate API delay
            await new Promise(resolve => setTimeout(resolve, 800));
            
            // Mock token validation
            // In real implementation, this would call your backend middleware
            return token && token.startsWith('mock-jwt-token');
        }

        async function mockTokenRefreshAPI(oldToken) {
            // Simulate API delay
            await new Promise(resolve => setTimeout(resolve, 800));
            
            // Mock token refresh
            // In real implementation, this would call your backend refresh endpoint
            if (oldToken && oldToken.startsWith('mock-jwt-token')) {
                return 'mock-jwt-token-refreshed-' + Date.now();
            }
            return null;
        }
    </script>
</body>
</html>
