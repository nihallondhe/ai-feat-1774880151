<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login with Token Validation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#1e40af'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Login System</h1>
        
        <!-- Login Form -->
        <div id="loginForm">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="username">
                    Username
                </label>
                <input type="text" id="username" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                    Password
                </label>
                <input type="password" id="password" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
            </div>
            
            <button id="loginBtn" 
                class="w-full bg-primary hover:bg-secondary text-white font-bold py-2 px-4 rounded-md transition duration-300">
                Login
            </button>
            
            <div id="loginError" class="mt-4 text-red-500 text-sm hidden"></div>
        </div>
        
        <!-- Protected Content (Initially Hidden) -->
        <div id="protectedContent" class="hidden">
            <div class="text-center mb-6">
                <div class="text-green-500 text-4xl mb-4">✓</div>
                <h2 class="text-xl font-bold text-gray-800">Welcome!</h2>
                <p class="text-gray-600 mt-2">Token validation successful</p>
            </div>
            
            <div class="bg-gray-50 p-4 rounded-md mb-6">
                <h3 class="font-bold text-gray-700 mb-2">User Information</h3>
                <p id="userInfo" class="text-gray-600">Loading user data...</p>
            </div>
            
            <button id="logoutBtn" 
                class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-md transition duration-300">
                Logout
            </button>
        </div>
    </div>

    <script>
        // Token validation middleware
        const tokenValidationMiddleware = {
            validateToken: function(token) {
                return new Promise((resolve, reject) => {
                    // Simulate API call delay
                    setTimeout(() => {
                        if (!token) {
                            reject({ valid: false, error: 'No token provided' });
                            return;
                        }
                        
                        // In a real app, this would validate against your backend
                        const isValid = token.startsWith('valid_');
                        const isExpired = token.includes('expired');
                        
                        if (!isValid) {
                            reject({ valid: false, error: 'Invalid token format' });
                        } else if (isExpired) {
                            reject({ valid: false, error: 'Token has expired' });
                        } else {
                            resolve({ 
                                valid: true, 
                                user: { 
                                    username: 'demo_user',
                                    email: 'user@example.com',
                                    role: 'member'
                                }
                            });
                        }
                    }, 1000);
                });
            },
            
            requireAuth: function() {
                return async function(next) {
                    const token = localStorage.getItem('authToken');
                    
                    if (!token) {
                        throw new Error('Authentication required');
                    }
                    
                    try {
                        const validation = await this.validateToken(token);
                        return validation;
                    } catch (error) {
                        throw new Error(`Token validation failed: ${error.error}`);
                    }
                }.bind(this);
            }
        };

        // Login function with token validation
        async function login(username, password) {
            try {
                // Simulate API call
                const response = await mockLoginAPI(username, password);
                
                if (response.success) {
                    // Store token
                    localStorage.setItem('authToken', response.token);
                    
                    // Validate token using middleware
                    const validation = await tokenValidationMiddleware.validateToken(response.token);
                    
                    if (validation.valid) {
                        showProtectedContent(validation.user);
                    } else {
                        showError('Token validation failed after login');
                    }
                } else {
                    showError(response.error);
                }
            } catch (error) {
                showError(error.message);
            }
        }

        // Check existing token on page load
        async function checkExistingToken() {
            const token = localStorage.getItem('authToken');
            
            if (token) {
                try {
                    const validation = await tokenValidationMiddleware.validateToken(token);
                    if (validation.valid) {
                        showProtectedContent(validation.user);
                    } else {
                        localStorage.removeItem('authToken');
                    }
                } catch (error) {
                    localStorage.removeItem('authToken');
                }
            }
        }

        // Protected function that requires token validation
        async function fetchProtectedData() {
            try {
                const authCheck = tokenValidationMiddleware.requireAuth();
                const validation = await authCheck();
                
                // This code only runs if token is valid
                document.getElementById('userInfo').innerHTML = `
                    <strong>Username:</strong> ${validation.user.username}<br>
                    <strong>Email:</strong> ${validation.user.email}<br>
                    <strong>Role:</strong> ${validation.user.role}
                `;
                
                return validation.user;
            } catch (error) {
                showError(error.message);
                logout();
                return null;
            }
        }

        // Mock API functions
        async function mockLoginAPI(username, password) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    if (username === 'demo' && password === 'password') {
                        resolve({
                            success: true,
                            token: 'valid_token_' + Date.now(),
                            user: { username: 'demo_user' }
                        });
                    } else {
                        resolve({
                            success: false,
                            error: 'Invalid credentials'
                        });
                    }
                }, 800);
            });
        }

        // UI Functions
        function showProtectedContent(user) {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('protectedContent').classList.remove('hidden');
            fetchProtectedData();
        }

        function showLoginForm() {
            document.getElementById('protectedContent').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('loginError').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function showError(message) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function logout() {
            localStorage.removeItem('authToken');
            showLoginForm();
        }

        // Event Listeners
        document.getElementById('loginBtn').addEventListener('click', () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }
            
            login(username, password);
        });

        document.getElementById('logoutBtn').addEventListener('click', logout);

        // Allow form submission with Enter key
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginBtn').click();
            }
        });

        // Check for existing token on page load
        document.addEventListener('DOMContentLoaded', checkExistingToken);
    </script>
</body>
</html>
